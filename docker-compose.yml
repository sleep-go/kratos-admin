services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: kratos_admin
      MYSQL_USER: kratos
      MYSQL_PASSWORD: kratos
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.2-management
    environment:
      RABBITMQ_DEFAULT_USER: kratos
      RABBITMQ_DEFAULT_PASS: kratos
      RABBITMQ_DEFAULT_VHOST: kratos_admin
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  api:
    image: kratos-admin-api:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      target: admin-server
    command: ["-conf", "/app/configs/config.docker.yaml"]
    ports:
      - "8000:8000"
      - "9000:9000"
    volumes:
      - file-data:/data/files
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  init-admin:
    image: kratos-admin-init-admin:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      target: init-admin
    command: ["init-admin", "--conf", "/app/configs/config.docker.yaml"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    image: kratos-admin-frontend:latest
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      init-admin:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  file-data:
