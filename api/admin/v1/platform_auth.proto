syntax = "proto3";

package admin.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "admin/v1/auth.proto";

option go_package = "github.com/sleep-go/kratos-admin/api/admin/v1;v1";

// PlatformAuthService 提供平台管理员登录、代维与会话治理接口。
service PlatformAuthService {
  rpc Login(PlatformAuthServiceLoginRequest) returns (PlatformAuthServiceLoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/platform/auth/login"
      body: "*"
    };
  }
  rpc Refresh(PlatformAuthServiceRefreshRequest) returns (PlatformAuthServiceRefreshResponse) {
    option (google.api.http) = {
      post: "/api/v1/platform/auth/refresh"
      body: "*"
    };
  }
  rpc Logout(PlatformAuthServiceLogoutRequest) returns (PlatformAuthServiceLogoutResponse) {
    option (google.api.http) = {post: "/api/v1/platform/auth/logout"};
  }
  rpc Profile(PlatformAuthServiceProfileRequest) returns (PlatformAuthServiceProfileResponse) {
    option (google.api.http) = {get: "/api/v1/platform/auth/profile"};
  }
  rpc ListNavigation(PlatformAuthServiceListNavigationRequest) returns (PlatformAuthServiceListNavigationResponse) {
    option (google.api.http) = {get: "/api/v1/platform/auth/navigation"};
  }
  rpc ListSessions(PlatformAuthServiceListSessionsRequest) returns (PlatformAuthServiceListSessionsResponse) {
    option (google.api.http) = {get: "/api/v1/platform/auth/sessions"};
  }
  rpc RevokeSession(PlatformAuthServiceRevokeSessionRequest) returns (PlatformAuthServiceRevokeSessionResponse) {
    option (google.api.http) = {delete: "/api/v1/platform/auth/sessions/{session_id}"};
  }
  rpc Impersonate(PlatformAuthServiceImpersonateRequest) returns (PlatformAuthServiceImpersonateResponse) {
    option (google.api.http) = {
      post: "/api/v1/platform/auth/impersonate"
      body: "*"
    };
  }
}

// 以下请求/响应类型刻意与 auth.proto 分离，避免 buf lint 认为同一 message 被复用于多个 RPC。

message PlatformAuthServiceLoginRequest {
  string identifier = 1;
  string password = 2;
  string captcha_id = 3;
  string captcha_code = 4;
  string device_name = 5;
}

message PlatformAuthServiceLoginResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  CurrentUser user = 3;
  repeated TenantSummary tenants = 4;
  TenantSummary current_tenant = 5;
  string mfa_challenge_id = 6;
  bool mfa_required = 7;
}

message PlatformAuthServiceRefreshRequest {}

message PlatformAuthServiceRefreshResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  CurrentUser user = 3;
  repeated TenantSummary tenants = 4;
  TenantSummary current_tenant = 5;
}

message PlatformAuthServiceLogoutRequest {}
message PlatformAuthServiceLogoutResponse {}

message PlatformAuthServiceProfileRequest {}

message PlatformAuthServiceProfileResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  CurrentUser user = 3;
  repeated TenantSummary tenants = 4;
  TenantSummary current_tenant = 5;
}

message PlatformAuthServiceListNavigationRequest {}

message PlatformAuthServiceListNavigationResponse {
  repeated NavigationItem items = 1;
}

message PlatformAuthServiceListSessionsRequest {}

message PlatformAuthServiceListSessionsResponse {
  repeated Session items = 1;
}

message PlatformAuthServiceRevokeSessionRequest {
  string session_id = 1;
}

message PlatformAuthServiceRevokeSessionResponse {}

message PlatformAuthServiceImpersonateRequest {
  uint64 tenant_id = 1;
}

message PlatformAuthServiceImpersonateResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  TenantSummary current_tenant = 3;
  CurrentUser user = 4;
  repeated TenantSummary tenants = 5;
}
