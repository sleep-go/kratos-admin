syntax = "proto3";

package admin.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/sleep-go/kratos-admin/api/admin/v1;v1";

// AuthService 提供登录、MFA、令牌轮换与会话治理接口。
service AuthService {
  rpc GetCaptcha(GetCaptchaRequest) returns (GetCaptchaResponse) {
    option (google.api.http) = {get: "/api/v1/auth/captcha"};
  }
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }
  rpc VerifyMfa(VerifyMfaRequest) returns (VerifyMfaResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/mfa/verify"
      body: "*"
    };
  }
  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {post: "/api/v1/auth/logout"};
  }
  rpc SwitchTenant(SwitchTenantRequest) returns (SwitchTenantResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/switch-tenant"
      body: "*"
    };
  }
  rpc ExitImpersonation(ExitImpersonationRequest) returns (ExitImpersonationResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/exit-impersonation"
      body: "*"
    };
  }
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/forgot-password"
      body: "*"
    };
  }
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/reset-password"
      body: "*"
    };
  }
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {get: "/api/v1/auth/sessions"};
  }
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse) {
    option (google.api.http) = {delete: "/api/v1/auth/sessions/{session_id}"};
  }
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      put: "/api/v1/auth/profile"
      body: "*"
    };
  }
  rpc ListNavigation(ListNavigationRequest) returns (ListNavigationResponse) {
    option (google.api.http) = {get: "/api/v1/auth/navigation"};
  }
}

message GetCaptchaRequest {}

message GetCaptchaResponse {
  string captcha_id = 1;
  string image_data_uri = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message TenantSummary {
  uint64 id = 1;
  string name = 2;
}

message CurrentUser {
  uint64 id = 1;
  string display_name = 2;
  string avatar_url = 3;
  string realm = 4;
  repeated string permissions = 5;
  string username = 6;
  string email = 7;
  string phone = 8;
  bool mfa_enabled = 9;
  string mfa_channel = 10;
  uint64 impersonator_id = 11;
  bool impersonating = 12;
}

message LoginRequest {
  string identifier = 1;
  string password = 2;
  string captcha_id = 3;
  string captcha_code = 4;
  string device_name = 5;
}

message LoginResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  CurrentUser user = 3;
  repeated TenantSummary tenants = 4;
  TenantSummary current_tenant = 5;
  string mfa_challenge_id = 6;
  bool mfa_required = 7;
}

message VerifyMfaRequest {
  string challenge_id = 1;
  string code = 2;
}

message VerifyMfaResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  CurrentUser user = 3;
  repeated TenantSummary tenants = 4;
  TenantSummary current_tenant = 5;
}

message RefreshRequest {}

message RefreshResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  CurrentUser user = 3;
  repeated TenantSummary tenants = 4;
  TenantSummary current_tenant = 5;
}

message LogoutRequest {}

message LogoutResponse {}

message SwitchTenantRequest {
  uint64 tenant_id = 1;
}

message SwitchTenantResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  TenantSummary current_tenant = 3;
  CurrentUser user = 4;
  repeated TenantSummary tenants = 5;
}

message ForgotPasswordRequest {
  string identifier = 1;
  string channel = 2;
}

message ForgotPasswordResponse {
  string challenge_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ResetPasswordRequest {
  string challenge_id = 1;
  string code = 2;
  string new_password = 3;
}

message ResetPasswordResponse {}

message Session {
  string id = 1;
  uint64 tenant_id = 2;
  string device_name = 3;
  string ip = 4;
  string user_agent = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  bool current = 8;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session items = 1;
}

message RevokeSessionRequest {
  string session_id = 1;
}

message RevokeSessionResponse {}

message UpdateProfileRequest {
  string display_name = 1;
  string avatar_url = 2;
  string email = 3;
  string phone = 4;
}

message UpdateProfileResponse {
  CurrentUser user = 1;
}

message NavigationItem {
  uint64 id = 1;
  uint64 parent_id = 2;
  string code = 3;
  string name = 4;
  string route_path = 5;
  string component_key = 6;
  string icon = 7;
  uint32 sort_order = 8;
}

message ListNavigationRequest {}

message ListNavigationResponse {
  repeated NavigationItem items = 1;
}

message ExitImpersonationRequest {}

message ExitImpersonationResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  CurrentUser user = 3;
  repeated TenantSummary tenants = 4;
  TenantSummary current_tenant = 5;
}
