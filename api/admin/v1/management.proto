syntax = "proto3";

package admin.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/sleep-go/kratos-admin/api/admin/v1;v1";

// ManagementService 提供白名单后台资源的统一分页与维护接口。
service ManagementService {
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse) {
    option (google.api.http) = {get: "/api/v1/management/{resource}"};
  }
  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse) {
    option (google.api.http) = {
      post: "/api/v1/management/{resource}"
      body: "data"
    };
  }
  rpc UpdateResource(UpdateResourceRequest) returns (UpdateResourceResponse) {
    option (google.api.http) = {
      put: "/api/v1/management/{resource}/{id}"
      body: "data"
    };
  }
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse) {
    option (google.api.http) = {delete: "/api/v1/management/{resource}/{id}"};
  }
  rpc GetEffectiveSettings(GetEffectiveSettingsRequest) returns (GetEffectiveSettingsResponse) {
    option (google.api.http) = {get: "/api/v1/settings/effective"};
  }
  rpc TestProviderConnection(TestProviderConnectionRequest) returns (TestProviderConnectionResponse) {
    option (google.api.http) = {post: "/api/v1/management/providers/{id}/connection-test"};
  }
  rpc UpdateRoleAuthorization(UpdateRoleAuthorizationRequest) returns (UpdateRoleAuthorizationResponse) {
    option (google.api.http) = {
      put: "/api/v1/management/roles/{role_id}/authorization"
      body: "*"
    };
  }
  rpc UpdateTenantFeatures(UpdateTenantFeaturesRequest) returns (UpdateTenantFeaturesResponse) {
    option (google.api.http) = {
      put: "/api/v1/management/tenants/{tenant_id}/features"
      body: "*"
    };
  }
}

message ListResourcesRequest {
  string resource = 1;
  uint32 page = 2;
  uint32 page_size = 3;
  string keyword = 4;
  string sort = 5;
  map<string, string> filters = 6;
  uint64 target_tenant_id = 7;
}

message ListResourcesResponse {
  repeated google.protobuf.Struct items = 1;
  uint64 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

message CreateResourceRequest {
  string resource = 1;
  google.protobuf.Struct data = 2;
  uint64 target_tenant_id = 3;
}

message UpdateResourceRequest {
  string resource = 1;
  uint64 id = 2;
  google.protobuf.Struct data = 3;
  uint64 target_tenant_id = 4;
}

message DeleteResourceRequest {
  string resource = 1;
  uint64 id = 2;
  uint64 target_tenant_id = 3;
}

message CreateResourceResponse {
  uint64 id = 1;
}

message UpdateResourceResponse {
  uint64 id = 1;
}

message DeleteResourceResponse {
  uint64 id = 1;
}

message GetEffectiveSettingsRequest {
  string category = 1;
}

message GetEffectiveSettingsResponse {
  repeated google.protobuf.Struct items = 1;
}

message TestProviderConnectionRequest {
  uint64 id = 1;
}

message TestProviderConnectionResponse {
  bool success = 1;
  string message = 2;
}

message RoleResourceGrant {
  string resource_code = 1;
  repeated string actions = 2;
}

message UpdateRoleAuthorizationRequest {
  uint64 role_id = 1;
  uint32 data_scope = 2;
  repeated RoleResourceGrant grants = 3;
  repeated uint64 department_ids = 4;
  uint64 target_tenant_id = 5;
}

message UpdateRoleAuthorizationResponse {
  uint64 role_id = 1;
}

message UpdateTenantFeaturesRequest {
  uint64 tenant_id = 1;
  repeated uint64 resource_ids = 2;
}

message UpdateTenantFeaturesResponse {
  uint64 tenant_id = 1;
}
