environment: ${KRATOS_ADMIN_ENV:development}

server:
  http:
    network: tcp
    addr: ${KRATOS_ADMIN_HTTP_ADDR:0.0.0.0:8000}
    timeout: 15s
  grpc:
    network: tcp
    addr: ${KRATOS_ADMIN_GRPC_ADDR:0.0.0.0:9000}
    timeout: 15s

data:
  database:
    driver: mysql
    source: ${KRATOS_ADMIN_MYSQL_DSN:kratos:kratos@tcp(127.0.0.1:3306)/kratos_admin?charset=utf8mb4&parseTime=True&loc=Local}
  redis:
    network: tcp
    addr: ${KRATOS_ADMIN_REDIS_ADDR:127.0.0.1:6379}
    db: ${KRATOS_ADMIN_REDIS_DB:0}
    read_timeout: 2s
    write_timeout: 2s

auth:
  access_ttl: ${KRATOS_ADMIN_ACCESS_TTL:900s}
  refresh_ttl: ${KRATOS_ADMIN_REFRESH_TTL:168h}
  jwt_private_key: ${KRATOS_ADMIN_JWT_PRIVATE_KEY:}
  secret_key: ${KRATOS_ADMIN_SECRET_KEY:}

storage:
  provider: ${KRATOS_ADMIN_STORAGE_PROVIDER:local}
  local_path: ${KRATOS_ADMIN_STORAGE_LOCAL_PATH:./data/files}
  max_file_size: ${KRATOS_ADMIN_STORAGE_MAX_FILE_SIZE:104857600}
  oss_region: ${KRATOS_ADMIN_OSS_REGION:}
  oss_endpoint: ${KRATOS_ADMIN_OSS_ENDPOINT:}
  oss_bucket: ${KRATOS_ADMIN_OSS_BUCKET:}
  oss_access_key_id: ${KRATOS_ADMIN_OSS_ACCESS_KEY_ID:}
  oss_access_key_secret: ${KRATOS_ADMIN_OSS_ACCESS_KEY_SECRET:}
  oss_security_token: ${KRATOS_ADMIN_OSS_SECURITY_TOKEN:}

messaging:
  smtp_address: ${KRATOS_ADMIN_SMTP_ADDRESS:}
  smtp_host: ${KRATOS_ADMIN_SMTP_HOST:}
  smtp_username: ${KRATOS_ADMIN_SMTP_USERNAME:}
  smtp_password: ${KRATOS_ADMIN_SMTP_PASSWORD:}
  smtp_from: ${KRATOS_ADMIN_SMTP_FROM:}
  smtp_use_tls: ${KRATOS_ADMIN_SMTP_USE_TLS:false}
  aliyun_sms_region: ${KRATOS_ADMIN_ALIYUN_SMS_REGION:cn-hangzhou}
  aliyun_sms_endpoint: ${KRATOS_ADMIN_ALIYUN_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
  aliyun_sms_access_key_id: ${KRATOS_ADMIN_ALIYUN_SMS_ACCESS_KEY_ID:}
  aliyun_sms_access_key_secret: ${KRATOS_ADMIN_ALIYUN_SMS_ACCESS_KEY_SECRET:}
  aliyun_sms_sign_name: ${KRATOS_ADMIN_ALIYUN_SMS_SIGN_NAME:}
  aliyun_sms_template_code: ${KRATOS_ADMIN_ALIYUN_SMS_TEMPLATE_CODE:}
